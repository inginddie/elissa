[project]
name = "elissa"
version = "1.3.0"
description = "Asistente de voz de escritorio para Windows, agnóstico de proveedor de IA (OpenAI, Claude, Gemini, OpenRouter, Ollama...)"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.13.0",
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "edge-tts>=7.2.8",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "mcp>=2.3.0",
    "openai>=3.28.0",
    "openpyxl>=3.1.5",
    "pycaw>=20260927",
    "pypdf>=6.20.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.6",
    "uiautomation>=2.0.29",
    "uvicorn[standard]>=0.54.0",
    "vosk>=0.3.45",
    "websockets>=17.2",
    "winrt-windows-foundation==3.2.1",
    "winrt-windows-foundation-collections==3.2.1",
    "winrt-windows-media-control==3.2.1",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
