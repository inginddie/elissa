# Tests and builds on every push, on Windows, macOS (Apple Silicon) and Linux. On a tag like v1.4.0 it also creates a
# draft release with the notes from CHANGELOG.md, and each system adds its installer and its entry in the signed update
# manifest (latest.json) that installed copies check for updates.
# Secrets for signed updates: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  release:
    # One draft release per tag, created before the builds so they all upload to the same one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - name: Create the draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The id comes from the creation's own response: a draft just created isn't listed right away.
        run: |
          uv run --no-project python scripts/release_notes.py "${{ github.ref_name }}" > notes.md
          id=$(gh api -X POST "repos/${{ github.repository }}/releases" -f tag_name="${{ github.ref_name }}"             -f name="Elissa ${{ github.ref_name }}" -F draft=true -F body=@notes.md --jq .id)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # Also on plain pushes and pull requests, where the release job is skipped.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: Elissa-Windows
            files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14  # Apple Silicon
            bundles: app,dmg
            artifact: Elissa-macOS-arm64
            files: desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: Elissa-Linux
            files: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage.zsync
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 libportaudio2 zsync

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tests
        run: uv run pytest -q

      - name: Build engine
        run: uv run pyinstaller packaging/elissa.spec --noconfirm --clean --distpath dist --workpath build

      - name: Self-test the engine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ELISSA_HOME = "$env:RUNNER_TEMP\elissa-home"
          $p = Start-Process dist\elissa-engine\elissa-engine.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:ELISSA_HOME\logs\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Self-test the engine (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          export ELISSA_HOME="$RUNNER_TEMP/elissa-home"
          if [ "$RUNNER_OS" = "Linux" ]; then export ELISSA_SELFTEST_NO_KEYRING=1; fi
          status=0
          dist/elissa-engine/elissa-engine --selftest || status=$?
          cat "$ELISSA_HOME/logs/selftest.txt"
          exit $status

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build installer (and add it to the release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # AppImage only: linuxdeploy's AppImage plugin embeds this (appimagetool -u), so AppImageUpdate and
          # AppImageHub can update Elissa too; the .zsync is made in the next step. Elissa's own updater is unchanged.
          LDAI_UPDATE_INFORMATION: ${{ runner.os == 'Linux' && 'gh-releases-zsync|inginddie|elissa|latest|Elissa_*_amd64.AppImage.zsync' || '' }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          args: --bundles ${{ matrix.bundles }}
          releaseId: ${{ needs.release.outputs.id }}

      - name: AppImage update information (and the .zsync on tags)
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd desktop/src-tauri/target/release/bundle/appimage
          ls -la
          appimage=$(ls Elissa_*_amd64.AppImage)
          # Read the .upd_info ELF section instead of running the AppImage (that would start Elissa without a display).
          info=$(readelf --string-dump=.upd_info "$appimage" | sed -n 's/^ *\[ *[0-9a-f]*\] *//p' | head -n 1)
          echo "update information: $info"
          case "$info" in gh-releases-zsync\|inginddie\|elissa\|latest\|*) ;; *) echo "::error::no update information"; exit 1;; esac
          # Relative URL: the .zsync and the AppImage are assets of the same release.
          zsyncmake -u "$appimage" -o "$appimage.zsync" "$appimage"
          test -s "$appimage.zsync"
          if [ -n "${{ needs.release.outputs.id }}" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" \
              --data-binary "@$appimage.zsync" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.release.outputs.id }}/assets?name=$appimage.zsync" >/dev/null
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
