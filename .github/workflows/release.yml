# Tests and builds on every push. On a tag like v0.2.0 it also publishes the installer and the signed update
# manifest (latest.json) that installed copies check for updates.
# Secrets for signed updates: TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Tests
        run: uv run pytest -q

      - name: Build engine
        run: uv run pyinstaller packaging/elissa.spec --noconfirm --clean --distpath dist --workpath build

      - name: Self-test the engine
        shell: pwsh
        run: |
          $env:ELISSA_HOME = "$env:RUNNER_TEMP\elissa-home"
          $p = Start-Process dist\elissa-engine\elissa-engine.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:ELISSA_HOME\logs\selftest.txt"
          if ($p.ExitCode -ne 0) { throw "selftest failed" }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build installer (and release on tags)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: Elissa ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true

      - uses: actions/upload-artifact@v7
        with:
          name: Elissa-Setup
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
