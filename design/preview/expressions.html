<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1400px; height: 470px; overflow: hidden; background: #17112f;
    font: 600 15px "Segoe UI", sans-serif; color: #c9c3f0; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); padding: 14px 10px 0; }
  figure { margin: 0; text-align: center; }
  canvas { width: 190px; height: 180px; display: block; margin: 0 auto; }
  figcaption { margin: -6px 0 10px; letter-spacing: .02em; }
</style>
</head>
<body>
<div class="grid" id="g"></div>
<script type="module">
  import { Character } from '/elissa/static/character.js';
  const names = [['idle', 'Idle'], ['listening', 'Listening'], ['thinking', 'Thinking'], ['working', 'Working'],
    ['speaking', 'Speaking'], ['happy', 'Happy'], ['approval', 'Needs you'], ['error', 'Oops'],
    ['sleeping', 'Sleeping'], ['annoyed', 'Poked'], ['dizzy', 'Dizzy'], ['love', 'Love'],
    ['surprised', 'Surprised'], ['waking', 'Waking up']];
  for (const [n, label] of names) {
    const f = document.createElement('figure');
    const c = document.createElement('canvas');
    f.append(c, Object.assign(document.createElement('figcaption'), { textContent: label }));
    document.getElementById('g').append(f);
    const ch = new Character(c);
    ch.blink.next = Infinity;
    ch.nextGlance = Infinity;
    ch.levelSource = () => (n === 'speaking' || n === 'listening' ? 0.6 : 0);
    ch.setState(n);
  }
</script>
</body>
</html>
